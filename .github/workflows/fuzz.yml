name: Fuzz (nightly)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: Bounded-rational fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo-fuzz binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml') }}

      - name: Install cargo-fuzz
        run: which cargo-fuzz || cargo install cargo-fuzz

      - name: Fuzz bounded rational (5h 50m)
        id: bounded_rational
        shell: bash
        run: |
          set -o pipefail
          cargo fuzz run bounded_rational -- -max_total_time=21000 2>&1 | tee fuzz-bounded_rational.log
        continue-on-error: true

      - name: Upload fuzz failures
        if: ${{ always() && steps.bounded_rational.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ github.run_id }}
          path: |
            fuzz/artifacts/
            fuzz-bounded_rational.log
          if-no-files-found: warn
          retention-days: 30

      - name: Record fuzz failure
        if: ${{ always() && steps.bounded_rational.outcome == 'failure' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Nightly fuzz failure"
        run: |
          report_file="fuzz-failure.md"
          {
            echo "The nightly bounded-rational fuzz target failed."
            echo
            echo "- Run and artifacts: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Reproduce: \`cargo +nightly fuzz run bounded_rational fuzz/artifacts/bounded_rational/<crash-file>\`"
            echo
            echo "## Fuzz output"
            echo
            echo '```text'
            tail -n 1000 fuzz-bounded_rational.log
            echo '```'
          } > "$report_file"

          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$ISSUE_TITLE in:title" \
            --json number,title \
            --limit 100 \
            --jq '.[] | select(.title == "Nightly fuzz failure") | .number' \
            | head -n 1)"

          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" --body-file "$report_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$report_file"
          fi

      - name: Fail workflow when fuzzing finds a failure
        if: ${{ always() && steps.bounded_rational.outcome == 'failure' }}
        run: exit 1
